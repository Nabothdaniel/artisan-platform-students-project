services:
  - type: web
    name: artisanhub-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_URI
        sync: false
      - key: CORS_ORIGINS
        value: "https://your-frontend-domain.onrender.com,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,*"
